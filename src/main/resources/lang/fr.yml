  "title": "&eCommandes de XmasLights :"
  "give": "&6/{label} give <type> [quantité] [joueur]&7 — Donner des kits."
  "remove": "&6/{label} remove [outline]&7 — Supprimer le segment regardé ou toute la chaîne."
