  "reload": "&6/{label} reload&7 — Recharger configuration, types et traductions."
  "owner": "&6/{label} owner <joueur>&7 — Attribuer la chaîne regardée à un joueur."
  "group-create": "&6/{label} group create <nom>&7 — Créer un groupe vide."
  "group-edit": "&6/{label} group edit <nom|none>&7 — Choisir le groupe des nouvelles lumières."
  "group-add": "&6/{label} group add <nom>&7 — Ajouter la chaîne regardée."
