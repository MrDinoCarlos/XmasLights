  "title": "&eXmasLights commands:"
  "give": "&6/{label} give <type> [amount] [player]&7 — Give light kits."
  "remove": "&6/{label} remove [outline]&7 — Delete the segment or chain you are looking at."
  "spawn": "&6/{label} spawn <group|all>&7 — Show saved lights."
  "despawn": "&6/{label} despawn [group|all]&7 — Hide lights without deleting them."
  "regenerate": "&6/{label} regenerate [group|all]&7 — Rebuild with the current settings."
  "on": "&6/{label} on [group|all]&7 — Switch lights on."
  "off": "&6/{label} off [group|all]&7 — Switch lights off."
  "mode": "&6/{label} mode <mode> [group|all]&7 — Change the animation."
  "group": "&6/{label} group&7 — Manage shared groups."
  "groups": "&6/{label} groups&7 — List groups."
  "chain": "&6/{label} chain&7 — Toggle extending strings with each click."
  "save": "&6/{label} save&7 — Save lights and groups."
  "types": "&6/{label} types&7 — List types and their IDs."
  "reload": "&6/{label} reload&7 — Reload config, types and all translations."
  "owner": "&6/{label} owner <player>&7 — Assign the chain you are looking at to a player."
  "group-create": "&6/{label} group create <name>&7 — Create an empty group."
  "group-edit": "&6/{label} group edit <name|none>&7 — Choose the group for new lights."
  "group-add": "&6/{label} group add <name>&7 — Add the chain you are looking at."
  "group-unassign": "&6/{label} group unassign&7 — Remove the selected chain from its group."
  "group-info": "&6/{label} group info <name>&7 — Show group details."
  "group-rename": "&6/{label} group rename <group> <new-name>&7 — Rename a group."
  "group-delete": "&6/{label} group delete <name> [confirm]&7 — Permanently delete the group and its lights."
