# English (default)
# Edit text after the colon, never the keys.
# Keep placeholders such as {count} exactly as written.
# Colors: &0..&9, &a..&f, &l bold, &o italic, &r reset.
# Missing keys are added automatically; existing text is preserved.
# Reload with /xl reload. Command IDs (give, all, none, modes) stay unchanged.

