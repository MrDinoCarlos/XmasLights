# Español
# Edita el texto después de los dos puntos, nunca las claves.
# Conserva exactamente los marcadores como {count}.
# Colores: &0..&9, &a..&f, &l negrita, &o cursiva, &r reiniciar.
# Las claves nuevas se añaden sin sustituir tus traducciones.
# Recarga con /xl reload. Los comandos y sus identificadores no se traducen.

"language-version": 10
