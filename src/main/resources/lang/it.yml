# Italiano
# Modifica il testo dopo i due punti, mai le chiavi.
# Mantieni esattamente i segnaposto come {count}.
# Colori: &0..&9, &a..&f, &l grassetto, &o corsivo, &r ripristino.
# Le nuove chiavi vengono aggiunte senza sostituire i tuoi testi.
# Ricarica con /xl reload. Gli identificatori dei comandi restano invariati.

