# XmasLights - light type definitions | UTF-8
# Reload with /xl reload. Loaded strings rebuild gradually; hidden strings stay hidden.
# Missing built-in types are added with a dated backup. Existing values and
# your own types are preserved. Use a unique lowercase ID (letters, numbers, - or _).
# IDs are used in commands and saved data: do not rename IDs of placed lights.
types-version: 8
#
# name-key: translation key in lang/<code>.yml; built-in names are localized.
# name: fallback literal name, with & colors. Editing it overrides the built-in
# translation. For your own type use name-key without name for a translated name,
# or set custom: true and name: "..." to always use your literal custom name.
# style: hanging or wall (wall snap/orientation). Pine outlines also have sag.
# wire: whether to display wire (default: true for hanging, false for wall).
# item: material of the kit (default: PLAYER_HEAD with heads, otherwise STRING).
# size: bulb size in blocks (0.05..4; default 0.2).
# spacing: bulb distance in blocks (0.1..16; default from config.yml).
# sag: optional sag factor (0..1); omitted uses config.yml. Applies to wall outlines too; sag: 0 is deliberately straight.
# chain: vertical drop to each socket (0..4; default 0); works on walls too.
# light-level: real light intensity (0..15; omitted uses config.yml).
# blocks: Minecraft block data strings, in alternating order along the string.
# heads: texture hash, textures.minecraft.net URL or base64 texture property.
# Only textures.minecraft.net is accepted; no arbitrary hosts or profile lookups.
# If heads is nonempty, it is used instead of blocks.
# rgb: optional list of "#RRGGBB" colors, in physical bulb order. Without it,
# block colors and the built-in head types are inferred automatically.
# model: classic, snowy or rgb for a batched pine garland; bulb for a rounded lamp, cube for a compact Minecraft-style lamp.
# model-pack.enabled: false uses a vanilla representation with the same entity budget.
# Pines use two displays per module: unlit foliage and eight independently tinted LEDs.
# The bulb model uses one display per bulb. All emitters share their module's effect.
# config.yml limits cap the number of bulbs/entities for every type.
# To remove a built-in type without it returning, define it as a custom replacement
# instead. Do not delete a type while placed strings still refer to it.
#
types:
  # ---- Pine garlands with natural sag; matching straight wall-* types below ----
  garland-classic:
    name-key: names.garland-classic
    name: "&6Classic Pine Garland"
    model: classic
