name: Verify and package supported Paper versions
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile, test and package
        run: sh mvnw -B -ntp clean verify
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Package version-specific descriptors and resource packs
        run: python tools/verify_matrix.py --package-only
      - uses: actions/upload-artifact@v4
        with:
          name: XmasLights-versioned-builds
          path: |
            target/XmasLights-*.jar
            src/main/resources/packs/XmasLights-Models-1.21.4.zip
            target/surefire-reports/
            dist/*/
